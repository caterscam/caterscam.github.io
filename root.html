<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Tools - URL to Domain Root</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee+Tint&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-900">

<div class="bg-gray-800 p-8 rounded-lg shadow-md w-96">
  <h1 class="text-2xl font-bold mb-4 text-center text-red-600" style="font-family: 'Bungee Tint', cursive;">Caterscam - URL to Domain Root</h1>

  <label for="inputList" class="font-semibold text-red-500 uppercase" style="font-family: 'Bungee Tint', cursive; font-size: 0.75rem;">URL / String List:</label>
  <textarea id="inputList" rows="6" class="mt-1 w-full p-2 border border-gray-600 bg-gray-700 text-white rounded" placeholder="https://www.google.com/page5&#10;yahoo.finance/index.php&#10;blog.bing.edu/search.php"></textarea>

  <label class="flex items-center mt-3 text-sm text-gray-300"><input type="checkbox" id="optRoot" class="mr-2"> Buang subdomain (root domain saja)</label>
  <label class="flex items-center mt-1 text-sm text-gray-300"><input type="checkbox" id="optDedupe" class="mr-2" checked> Hapus duplikat</label>

  <button id="processButton" class="mt-4 w-full bg-blue-600 text-white font-semibold py-2 rounded hover:bg-blue-500">Process List</button>

  <h2 id="resultLabel" class="mt-4 text-lg font-semibold text-red-500 uppercase" style="font-family: 'Bungee Tint', cursive; font-size: 0.75rem;">Hasil:</h2>
  <textarea id="resultOutput" rows="6" class="w-full p-2 border border-gray-600 bg-gray-700 text-white rounded" readonly></textarea>
</div>

<script>
// Second-level umum di bawah ccTLD (com.au, co.uk, com.br, org.mx, ...)
const SLD = new Set(['com', 'co', 'net', 'org', 'edu', 'gov', 'ac', 'or', 'ne', 'go', 'gob', 'mil']);

function getRoot(token, rootOnly) {
  const t = token.replace(/^[("'<\[]+|[)"'>\],.;]+$/g, '');
  if (!t) return null;

  let host;
  try {
    host = new URL(/^[a-z][a-z0-9+.-]*:\/\//i.test(t) ? t : 'http://' + t).hostname;
  } catch {
    return null;
  }

  host = host.toLowerCase().replace(/\.$/, '').replace(/^(www\.)+/, '');

  // Skip IP address; harus berbentuk domain dengan TLD huruf
  if (host.includes(':') || /^\d+(\.\d+){3}$/.test(host)) return null;
  if (!/^(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+(?:[a-z]{2,}|xn--[a-z0-9-]+)$/.test(host)) return null;

  if (!rootOnly) return host;

  const p = host.split('.');
  if (p.length <= 2) return host;
  const tld = p[p.length - 1], sld = p[p.length - 2];
  return (tld.length === 2 && SLD.has(sld)) ? p.slice(-3).join('.') : p.slice(-2).join('.');
}

document.getElementById('processButton').addEventListener('click', function () {
  const rootOnly = document.getElementById('optRoot').checked;
  const dedupe = document.getElementById('optDedupe').checked;

  // Satu baris bisa berisi beberapa item (dipisah spasi, koma, atau titik koma)
  const tokens = document.getElementById('inputList').value.split(/[\s,;]+/).filter(Boolean);

  let results = [];
  let skipped = 0;
  for (const tok of tokens) {
    const root = getRoot(tok, rootOnly);
    if (root) results.push(root); else skipped++;
  }
  if (dedupe) results = [...new Set(results)];

  document.getElementById('resultOutput').value = results.join('\n');
  document.getElementById('resultLabel').textContent =
    'Hasil: ' + results.length + ' domain' + (skipped ? ' (' + skipped + ' dilewati)' : '');
});
</script>

</body>
</html>
