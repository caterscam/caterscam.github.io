<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Tools - Choser Domain Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee+Tint&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-900">

<div class="bg-gray-800 p-8 rounded-lg shadow-md w-96">
  <h1 class="text-2xl font-bold mb-4 text-center text-red-600" style="font-family: 'Bungee Tint', cursive;">Caterscam - Choser Domain</h1>

  <label for="mainListInput" class="font-semibold text-red-500 uppercase" style="font-family: 'Bungee Tint', cursive; font-size: 0.75rem;">Main List:</label>
  <textarea id="mainListInput" rows="4" class="mt-1 w-full p-2 border border-gray-600 bg-gray-700 text-white rounded" placeholder="google.com/page5&#10;yahoo.finance/index.php&#10;bing.edu/search.php"></textarea>

  <label for="chosenListInput" class="font-semibold text-red-500 uppercase mt-4 block" style="font-family: 'Bungee Tint', cursive; font-size: 0.75rem;">Chosen List:</label>
  <textarea id="chosenListInput" rows="4" class="mt-1 w-full p-2 border border-gray-600 bg-gray-700 text-white rounded" placeholder="google.com&#10;https://www.bing.edu"></textarea>

  <button id="processButton" class="mt-4 w-full bg-blue-600 text-white font-semibold py-2 rounded hover:bg-blue-500">Process Lists</button>

  <h2 class="mt-4 text-lg font-semibold text-red-500 uppercase" style="font-family: 'Bungee Tint', cursive; font-size: 0.75rem;">Hasil:</h2>
  <textarea id="resultOutput" rows="4" class="w-full p-2 border border-gray-600 bg-gray-700 text-white rounded" readonly></textarea>
</div>

<script>
document.getElementById('processButton').addEventListener('click', function () {
  const toLines = (text) => text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);

  const mainList = toLines(document.getElementById('mainListInput').value);
  const chosenList = toLines(document.getElementById('chosenListInput').value);

  // Ambil hostname, lowercase, dan buang "www." supaya
  // google.com == www.google.com == https://www.google.com/apa-saja
  const extractDomain = (url) => {
    try {
      const host = new URL(url.includes('://') ? url : 'http://' + url).hostname;
      return host.toLowerCase().replace(/^www\./, '');
    } catch {
      return null;
    }
  };

  const chosenDomains = new Set(chosenList.map(extractDomain).filter(Boolean));

  // Satu root domain hanya satu URL (yang pertama muncul di Main List),
  // www / tanpa www dianggap domain yang sama
  const seenDomains = new Set();
  const chosenUrls = mainList.filter(url => {
    const domain = extractDomain(url);
    if (!domain || !chosenDomains.has(domain) || seenDomains.has(domain)) return false;
    seenDomains.add(domain);
    return true;
  });

  document.getElementById('resultOutput').value = chosenUrls.join('\n');
});
</script>

</body>
</html>
